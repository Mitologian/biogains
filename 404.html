<body>
<p id="m">Memuat...</p>
<script>
// GitHub Pages menyajikan file ini untuk alamat yang tidak ada, mis. /miky.
// Alamat berbentuk /slug diteruskan ke index.html?u=slug (index.html lalu merapikan alamat kembali menjadi /slug).
var m=location.pathname.match(/^\/([a-z0-9-]{2,30})\/?$/);
if(m){location.replace('/?u='+m[1]);}
else{document.getElementById('m').innerHTML='Halaman tidak ditemukan. <a href="/">Ke beranda</a>';}
</script>
</body>
