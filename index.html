 var cta='<div class="closecta"><span class="cc-ic">'+IC_HAND+'</span><div class="cc-t">'+T('Langkah terakhir: kenalkan kita','Last step: introduce us')+'</div><div class="cc-s">'+T('Kenalkan, lalu sambungkan. Idealnya WhatsApp bertiga, meeting singkat, atau kasih nomor saya.','Introduce us, then connect. Ideally a WhatsApp trio, a short meeting, or share the number.')+'</div><a class="cc-btn" href="'+wa+'" target="_blank" rel="noopener">'+T('Hubungi Saya','Contact Me')+'</a></div>';
 return whoHTML+whatHow+cta;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderTier(k){
 var t=DATA.tiers[k];if(!t)return;
 var els=document.querySelectorAll('.tsel');for(var i=0;i<els.length;i++)els[i].classList.toggle('on',els[i].dataset.k===k);
 var tv=document.getElementById('tierview');if(!tv)return;
 tv.className='tierview tv-'+k;
 var chips=T(t.keywords_id,t.keywords_en).map(function(x){return '<span class="kwchip">'+x+'</span>';}).join('');
 var nm={meat:'Meat',cheese:'Cheese',bread:'Bread'}[k], tag={meat:'Main Course',cheese:'Tasty Middle',bread:'Easy Entry'}[k];
 tv.innerHTML=''
  +'<div class="tv-head"><span class="tv-ic">'+TIC[k]+'</span><div><div class="tv-nm">'+nm+'</div><div class="tv-tag">'+tag+'</div></div></div>'
  +'<div class="tv-row"><div class="tv-k">'+T('Apa','What')+'</div><div class="tv-v">'+T(t.apa_id,t.apa_en)+'</div></div>'
  +'<div class="tv-row"><div class="tv-k">'+T('Untuk siapa','For whom')+'</div><div class="tv-v">'+T(t.siapa_id,t.siapa_en)+'</div></div>'
  +'<div class="tv-lbl">'+T('Kalau dengar kata kunci ini','If you hear these keywords')+'</div><div class="kwcloud">'+chips+'</div>'
  +'<div class="tv-lbl">'+T('Pesan siap kirim, copy satu per satu','Ready to send, copy one by one')+'</div>'
  +'<div class="msgs">'+T(t.script_id,t.script_en).split(/\n{2,}/).map(function(p){return p.trim();}).filter(function(p){return p;}).map(function(p,i){return '<div class="msg" onclick="copyit(this)"><div class="msgn">'+(i+1)+'</div><div class="msgb"><div class="yt">'+esc(p)+'</div></div><div class="msgcta"><span class="yl">Copy</span><svg class="cp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></div></div>';}).join('')+'</div>';
}
function selectTier(k){curTier=k;renderTier(k);}
function copyText(t){
 return new Promise(function(res){
  if(navigator.clipboard&&window.isSecureContext){
   navigator.clipboard.writeText(t).then(function(){res(true);},function(){res(fallbackCopy(t));});
  } else { res(fallbackCopy(t)); }
 });
}
function fallbackCopy(t){
 try{
  var ta=document.createElement('textarea');
  ta.value=t;ta.setAttribute('readonly','');
  ta.style.position='fixed';ta.style.top='0';ta.style.left='-9999px';
  document.body.appendChild(ta);
  ta.select();ta.setSelectionRange(0,t.length);
  var ok=document.execCommand('copy');
  document.body.removeChild(ta);
  return ok;
 }catch(_){return false;}
}
function copyit(el){
 var t=el.querySelector('.yt').textContent;
 var yl=el.querySelector('.yl');var o=yl.innerHTML;
 copyText(t).then(function(ok){
  if(ok){el.classList.add('done');yl.textContent=T('Tersalin ✓','Copied ✓');}
  else {yl.textContent=T('Tekan lama untuk salin','Long-press to copy');}
  setTimeout(function(){el.classList.remove('done');yl.innerHTML=o;},1600);
 });
}

function pick(b,tileEl){
 cur=b;
 var tiles=document.querySelectorAll('.tile');for(var i=0;i<tiles.length;i++)tiles[i].classList.remove('active');
 var el=tileEl||document.querySelector('.tile[data-b="'+b+'"]');if(el)el.classList.add('active');
 var area=document.getElementById('infoarea');
 area.innerHTML='<div class="phead"><span class="pic">'+ICON[b]+'</span><span class="pt">'+T(TITLES[b][0],TITLES[b][1])+'</span></div><div class="pbody" id="pbody"></div>';
 var body=document.getElementById('pbody');
 if(b==='refer'){body.innerHTML=referHTML();renderTier(curTier);}
 else body.innerHTML=blocks(b);
 var sc=document.getElementById('scroll');if(sc)sc.scrollTop=0;
 if(KNOW.indexOf(b)>-1&&!read.has(b)){read.add(b);save();var t=document.querySelector('.tile[data-b="'+b+'"]');if(t)t.classList.add('done');updateProgress();}
}
function updateProgress(){
 var got=KNOW.filter(function(x){return read.has(x);}).length,pct=Math.round(got/KNOW.length*100);
 document.getElementById('ppct').textContent=pct;document.getElementById('fill').style.width=pct+'%';
 var k;if(pct<40)k=['Kenali saya','Get to know me'];else if(pct<100)k=['Makin kenal 👍','Getting to know me 👍'];else k=['Anda kenal saya!','You know me!'];
 document.getElementById('plabel').textContent=T(k[0],k[1]);
 var already=document.getElementById('referbar').classList.contains('show');
 if(pct===100){try{localStorage.setItem('dd_refer_unlocked','1');}catch(_){}}
 var un=(pct===100)||isUnlocked();
 showReferbar(un);
 if(un&&!already){var rb=document.getElementById('referbar');rb.classList.add('pop');setTimeout(function(){rb.classList.remove('pop');},520);}
}
function isUnlocked(){try{return localStorage.getItem('dd_refer_unlocked')==='1';}catch(_){return false;}}
function showReferbar(on){var pb=document.getElementById('progblock'),rb=document.getElementById('referbar');if(!pb||!rb)return;if(on){pb.style.display='none';rb.classList.add('show');}else{pb.style.display='';rb.classList.remove('show');}}
function enterApp(){var c=document.getElementById('cover');if(c)c.classList.add('hidden');}
function fitCoverName(){var el=document.getElementById('covername');if(!el)return;var cover=el.parentNode;var cs=getComputedStyle(cover);var avail=cover.clientWidth-parseFloat(cs.paddingLeft||0)-parseFloat(cs.paddingRight||0);if(avail<=0)return;el.style.fontSize='100px';var natural=el.scrollWidth||el.getBoundingClientRect().width;if(!natural)return;var size=100*(avail*0.99)/natural;size=Math.max(30,Math.min(size,98));el.style.fontSize=size+'px';}
window.addEventListener('resize',fitCoverName);
function waMe(){
 var m=document.getElementById('wamodal');
 if(!m){m=document.createElement('div');m.id='wamodal';m.className='wamodal';m.addEventListener('click',function(e){if(e.target===m)waClose();});document.body.appendChild(m);}
 m.innerHTML='<div class="wabox">'
  +'<div class="wahead">'+T('Hi! And you are?','Let\u2019s introduce you')+'</div>'
  +'<div class="wasub">'+T('Please fill this to get connected.','Fill this in, it goes straight to my WhatsApp.')+'</div>'
  +'<label class="walbl">'+T('Name','Name')+'</label><input id="wa_name" class="wain" autocomplete="name">'
  +'<label class="walbl">BNI Chapter</label><input id="wa_chapter" class="wain">'
  +'<label class="walbl">'+T('Business Classification','Business Classification')+'</label><input id="wa_class" class="wain">'
  +'<button class="wasend" onclick="waSend()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.5A10 10 0 1 0 12 2z"/></svg> '+T('WhatsApp Me','Send to WhatsApp')+'</button>'
  +'<button class="wacancel" onclick="waClose()">'+T('Cancel','Cancel')+'</button>'
  +'</div>';
 m.classList.add('show');
 setTimeout(function(){var n=document.getElementById('wa_name');if(n)n.focus();},60);
}
function waClose(){var m=document.getElementById('wamodal');if(m)m.classList.remove('show');}
function waSend(){
 var wa=(DATA.contact&&DATA.contact.wa)?DATA.contact.wa:'';
 var g=function(id){var e=document.getElementById(id);return e?e.value.trim():'';};
 var name=g('wa_name'),chap=g('wa_chapter'),cls=g('wa_class');
 var msg=(lang==='id')
  ? 'Hi Dedy! I just saw your Bio GAINS and would love to connect.\n\nNama: '+name+'\nBNI Chapter: '+chap+'\nKlasifikasi Bisnis: '+cls
  : 'Hi Dedy! I just saw your Bio GAINS and would love to connect.\n\nName: '+name+'\nBNI Chapter: '+chap+'\nBusiness Classification: '+cls;
 window.open('https://wa.me/'+wa+(wa?('?text='+encodeURIComponent(msg)):''),'_blank');
 waClose();
}
function shareLink(btn){
 var D=DATA;
 var url=(location&&location.href)?location.href.split('#')[0]:(D.bisnis&&D.bisnis.website?('https://'+D.bisnis.website.replace(/^https?:\/\//,'')):'');
 var title='Bio GAINS - '+(D.hero&&D.hero.name?D.hero.name:'Dedy Dahlan');
 var text=title+' - keep this link so you can find me again.';
 if(navigator.share){
   navigator.share({title:title,text:text,url:url}).catch(function(){});
   return;
 }
 var toCopy=title+'\n'+url;
 copyText(toCopy).then(function(ok){
   flashToast(ok?'Link copied. Paste it anywhere to save.':'Press and hold the link to copy.');
 });
}
function flashToast(msg){
 var t=document.getElementById('toast');
 if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}
 t.textContent=msg;t.classList.add('show');
 clearTimeout(window.__toastT);window.__toastT=setTimeout(function(){t.classList.remove('show');},2600);
}

function applyStatic(){
 var D=DATA;
 document.getElementById('coverrole').textContent=T(D.hero.role_id,D.hero.role_en);
 var cc=document.getElementById('coverconnect');if(cc)cc.textContent=T(D.hero.connector_id,D.hero.connector_en);
 document.getElementById('covername').textContent=D.hero.name;
 fitCoverName();
 if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fitCoverName);}
 document.getElementById('tbname').textContent=D.hero.name;
 document.querySelector('[data-t="cta_enter"]').textContent='Get to Know Me';
 document.querySelector('[data-t="fab"]').textContent='How to Refer Me';
 var rt=document.querySelector('[data-t="reftap"]');if(rt)rt.textContent=T('Tap Disini','Tap Here');
}
function setLang(l){lang=l;document.getElementById('lid').classList.toggle('on',l==='id');document.getElementById('len').classList.toggle('on',l==='en');document.documentElement.lang=l;
 applyStatic();pick(cur,document.querySelector('.tile[data-b="'+cur+'"]'));updateProgress();}

function init(){
 var D=DATA;
 if(D.images){if(D.images.cover)document.getElementById('cover').style.backgroundImage="url('"+D.images.cover+"')";
   if(D.images.hero)document.getElementById('hero').style.backgroundImage="url('"+D.images.hero+"')";}
 document.getElementById('nav').innerHTML=NAV.map(function(n){return '<button class="tile" data-b="'+n[0]+'" onclick="pick(\''+n[0]+'\',this)"><span class="chk">'+CHECK+'</span><span class="ico">'+ICON[n[0]]+'</span><span class="lab">'+(lang==='id'?n[1]:n[2])+'</span></button>';}).join('');
 applyStatic();
 NAV.forEach(function(n){if(read.has(n[0])){var t=document.querySelector('.tile[data-b="'+n[0]+'"]');if(t)t.classList.add('done');}});
 pick('bni',document.querySelector('.tile[data-b="bni"]'));
 updateProgress();
}
if(typeof DATA!=='undefined')init();
</script>
