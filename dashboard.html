<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Dashboard Chapter · Bio GAINS</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--red:#CF142B;--ink:#191919;--line:#e4e4e4;--muted:#6E6E6E;--bg:#f4f4f5}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Montserrat',system-ui,sans-serif}
  body{background:var(--bg);color:var(--ink);padding-bottom:40px}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 16px}
  .hin{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  header h1{font-size:16px;font-weight:800}
  header h1 span{color:var(--red)}
  header a{font-size:12.5px;font-weight:700;color:var(--red);text-decoration:none}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  .card0{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .card0 h2{font-size:15px;font-weight:800;margin-bottom:6px}
  .card0 p{font-size:12.5px;color:var(--muted);line-height:1.55}
  .err{color:#b00020;font-size:12.5px;font-weight:600;margin-top:10px;min-height:16px}
  #gbtn{margin-top:12px}
  .sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;background:#fff;margin-bottom:14px}
  input:focus{outline:none;border-color:var(--red)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  a.card{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--red);border-radius:12px;padding:12px;text-decoration:none;color:inherit}
  a.card:hover{border-color:var(--red)}
  .ph{flex:0 0 56px;width:56px;height:56px;border-radius:50%;background:#e9e9ea center/cover no-repeat;color:#999;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
  .n{font-weight:800;font-size:14.5px}
  .r{font-size:11.5px;font-weight:700;color:var(--red);margin-top:2px}
  .k{font-size:12.5px;margin-top:6px;line-height:1.4}
  .t{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
  .me{font-size:10px;font-weight:800;background:#e3f6e8;color:#14753a;border-radius:20px;padding:2px 8px;margin-left:6px;vertical-align:middle}
  .empty{color:var(--muted);font-size:13px;padding:30px 0;text-align:center}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="hin"><h1>Bio GAINS <span>· Dashboard Chapter</span></h1><a href="studio.html">Studio saya</a></div></header>
<div class="wrap">
  <div class="card0" id="c_login">
    <h2>Masuk</h2>
    <p>Dashboard ini hanya untuk anggota. Masuk dengan akun Google yang Anda pakai di Studio. Anda hanya melihat anggota dari chapter Anda sendiri.</p>
    <div id="gbtn"></div>
    <div class="err" id="e_login"></div>
  </div>
  <div id="main" hidden>
    <h2 id="chname" style="font-size:17px;font-weight:800"></h2>
    <div class="sub" id="count"></div>
    <input id="q" placeholder="Cari nama, bisnis, atau klasifikasi" autocomplete="off">
    <div id="grid" class="grid"></div>
    <div id="msg" class="empty"></div>
  </div>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script>
var idToken='',MEMBERS=[],SELF='';
var URL_RE=/^(?:img\/[\w.\-\/]{1,100}|https:\/\/drive\.google\.com\/thumbnail\?id=[\w-]{10,80}(?:&sz=w\d{3,4})?|https:\/\/lh3\.googleusercontent\.com\/d\/[\w-]{10,80}(?:=w\d{3,4})?)$/;
function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var ERR={auth:'Sesi habis, silakan masuk lagi.',no_chapter:'Akun Anda belum terhubung ke chapter. Hubungi admin.',blocked:'Akun ini dinonaktifkan.'};

function render(){
 var q=el('q').value.trim().toLowerCase();
 var list=MEMBERS.filter(function(p){return !q||(p.name+' '+p.role+' '+p.classification).toLowerCase().indexOf(q)>=0;});
 el('grid').innerHTML=list.map(function(p){
  var ph=URL_RE.test(p.photo||'')?'<div class="ph" style="background-image:url(\''+esc(p.photo)+'\')"></div>':'<div class="ph">'+esc((p.name||'?').charAt(0).toUpperCase())+'</div>';
  return '<a class="card" href="/'+encodeURIComponent(p.slug)+'">'+ph+'<div><div class="n">'+esc(p.name)+(p.slug===SELF?'<span class="me">Anda</span>':'')+'</div>'
   +(p.role?'<div class="r">'+esc(p.role)+'</div>':'')
   +(p.classification?'<div class="k">'+esc(p.classification)+'</div>':'')
   +(p.tagline?'<div class="t">'+esc(p.tagline)+'</div>':'')+'</div></a>';
 }).join('');
 el('msg').textContent=list.length?'':(MEMBERS.length?'Tidak ada hasil.':'Belum ada anggota yang mempublikasikan Bio GAINS.');
}

function onCred(resp){
 idToken=resp.credential;el('e_login').textContent='Memeriksa akun...';
 fetch(BG.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'chapter',idToken:idToken})})
 .then(function(r){return r.json();}).then(function(r){
  if(!r.ok){el('e_login').textContent=ERR[r.error]||'Terjadi kesalahan.';return;}
  if(!r.registered){el('e_login').innerHTML='Akun ini belum terdaftar. Daftar dulu di <a href="studio.html">Studio</a> dengan kode undangan.';return;}
  el('c_login').hidden=true;el('main').hidden=false;
  MEMBERS=r.members||[];SELF=r.self;
  el('chname').textContent=r.chapter.name;
  el('count').textContent=MEMBERS.length+' anggota sudah mempublikasikan Bio GAINS';
  render();
 }).catch(function(){el('e_login').textContent='Tidak bisa menghubungi server.';});
}
el('q').addEventListener('input',render);
window.addEventListener('load',function(){
 if(!BG.clientId){el('e_login').textContent='Konfigurasi belum lengkap (clientId kosong di config.js).';return;}
 var tries=0;(function init(){
  if(window.google&&google.accounts&&google.accounts.id){
   google.accounts.id.initialize({client_id:BG.clientId,callback:onCred});
   google.accounts.id.renderButton(el('gbtn'),{theme:'outline',size:'large',text:'signin_with',locale:'id'});
  }else if(tries++<50)setTimeout(init,150);
  else el('e_login').textContent='Gagal memuat Google Sign-In.';
 })();
});
</script>
</body>
</html>
